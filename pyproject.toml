[project]
name = "goldibench"
version = "1.0.0"
description = "GoldiBench: Right Tools, Wrong Amount. Benchmarking agents on effect judgement in professional editing."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<0.29",
    "pillow>=11",
    "pyyaml>=6",
    "numpy>=2",
    "scipy>=1.14",
    "scikit-image>=0.25",
    "beautifulsoup4>=4.12",
    "huggingface_hub>=0.30",
    "zstandard>=0.22",
    "opencv-python-headless>=4.10",
    # GUI channel: OSWorld's agents (cloned by scripts/setup_gui.sh) need these
    "openai>=1.60",
    "backoff>=2.2",
    "requests>=2.32",
]

[project.optional-dependencies]
# closed models: bench/bedrock_proxy.py (OpenAI-compatible proxy with a cost ledger) and Claude's computer-use agent
closed = ["anthropic>=0.50", "boto3>=1.35", "aiohttp>=3.10"]
# paper tables and figures (goldibench/paper)
paper = ["matplotlib>=3.9", "pymupdf>=1.24", "pandas>=2.2", "pyarrow>=17"]
dev = ["pytest>=8"]

[tool.uv]
package = false
